; TasteQuest ESP8266 firmware — PlatformIO project.
;
; `board = d1_mini` is only an EXAMPLE development target (ESP-12 module, 4 MB flash).
; It is NOT a confirmation of the board you own. Change it to match your board
; (e.g. nodemcuv2, esp12e, d1_mini) before flashing real hardware.
;
;   pio run -e sim           # simulation firmware: no GPIO used, Serial-driven input
;   pio run -e hardware      # real sensors: refuses to start until pins are set in include/config.h
;   pio run -e sim -t upload && pio device monitor

[platformio]
default_envs = sim

[env]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
lib_deps =
  bblanchon/ArduinoJson@^7.4.2
  olikraus/U8g2@^2.36.5
  adafruit/DHT sensor library@^1.4.6
  adafruit/Adafruit Unified Sensor@^1.1.15
build_flags = -Wall -Wextra

[env:sim]
build_flags = ${env.build_flags} -DTQ_SIMULATION_MODE=1

[env:hardware]
build_flags = ${env.build_flags} -DTQ_HARDWARE_MODE=1
